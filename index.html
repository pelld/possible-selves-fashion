<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Torunkëshk — an experimental fashion stylist interface.">
    <title>Torunkëshk</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ================================================================================================================
         00A. QUIET FIXED CONTROLS
         ================================================================================================================ -->
    <header class="site-controls">
        <button class="home-mark" id="reset" type="button" aria-label="Return to the opening screen">ë</button>

        <nav class="header-actions" aria-label="Shop controls">
            <button class="quiet-button" id="open-notes" type="button">Studio notes</button>
            <button class="quiet-button" id="open-look" type="button">Look <span id="look-count">0</span></button>
        </nav>
    </header>

    <main aria-live="polite">
        <!-- ============================================================================================================
             01A. OPENING — SAME MINIMALIST STRUCTURE, NEW NAME AND APPROVED FIGURES
             ============================================================================================================ -->
        <section class="screen screen--opening is-active" id="opening">
            <button class="wordmark-button" id="wordmark-reset" type="button" aria-label="Torunkëshk — return home">
                <svg class="wordmark" viewBox="0 0 1600 260" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Torunkëshk">
                    <text class="wordmark__outer" x="800" y="205" text-anchor="middle">Torunkëshk</text>
                    <text class="wordmark__cutout" x="800" y="205" text-anchor="middle">Torunkëshk</text>
                    <text class="wordmark__reaction" id="wordmark-reaction" x="800" y="205" text-anchor="middle">Torunkëshk</text>
                </svg>
            </button>

            <div class="character-grid" aria-label="Choose who to dress">
                <button class="character" data-character="man" type="button" aria-label="Dress a man">
                    <img src="assets/figure-man.png" alt="" aria-hidden="true">
                    <span>Man</span>
                </button>

                <button class="character" data-character="woman" type="button" aria-label="Dress a woman">
                    <img src="assets/figure-woman.png" alt="" aria-hidden="true">
                    <span>Woman</span>
                </button>

                <button class="character character--child" data-character="boy" type="button" aria-label="Dress a boy">
                    <img src="assets/figure-boy.png" alt="" aria-hidden="true">
                    <span>Boy</span>
                </button>

                <button class="character character--child" data-character="girl" type="button" aria-label="Dress a girl">
                    <img src="assets/figure-girl.png" alt="" aria-hidden="true">
                    <span>Girl</span>
                </button>
            </div>
        </section>

        <!-- ============================================================================================================
             02A. DRESSING ROOM — THE BODY REMAINS THE NAVIGATION
             ============================================================================================================ -->
        <section class="screen screen--dressing" id="dressing">
            <div class="dressing-copy">
                <p class="eyebrow" id="dressing-eyebrow">Begin anywhere</p>
                <h1 id="dressing-title">Choose where the first possibility begins.</h1>
                <p class="instruction" id="dressing-instruction">Move over the figure, then click a body area.</p>
            </div>

            <div class="stage">
                <div class="single-self" id="single-self">
                    <div class="figure-stage">
                        <img class="stage-person" id="central-person" src="assets/figure-man.png" alt="Neutral outline figure">

                        <div class="look-layers" id="current-look" aria-hidden="true"></div>

                        <!-- The hit areas are separate SVG shapes. They do not cover one another. -->
                        <svg class="body-map" viewBox="0 0 300 650" aria-label="Choose a clothing area">
                            <g class="body-zone" data-zone="accessories" tabindex="0" role="button" aria-label="Choose accessories">
                                <ellipse cx="150" cy="73" rx="50" ry="56"></ellipse>
                                <text x="150" y="76">Accessories</text>
                            </g>

                            <g class="body-zone" data-zone="outer" tabindex="0" role="button" aria-label="Choose outerwear">
                                <path d="M110 128 H190 L214 140 L208 194 H92 L86 140 Z"></path>
                                <path d="M86 140 C62 152 48 184 46 226 L42 354 H86 L92 194 Z"></path>
                                <path d="M214 140 C238 152 252 184 254 226 L258 354 H214 L208 194 Z"></path>
                                <text x="245" y="178">Outer</text>
                            </g>

                            <g class="body-zone" data-zone="top" tabindex="0" role="button" aria-label="Choose a top">
                                <path d="M94 196 L206 196 L202 352 L98 352 Z"></path>
                                <text x="150" y="273">Top</text>
                            </g>

                            <g class="body-zone" data-zone="bottom" tabindex="0" role="button" aria-label="Choose bottoms">
                                <path d="M100 354 L200 354 L204 548 L154 548 L150 411 L146 548 L96 548 Z"></path>
                                <text x="150" y="458">Legs</text>
                            </g>

                            <g class="body-zone" data-zone="shoes" tabindex="0" role="button" aria-label="Choose shoes">
                                <path d="M82 548 H146 V624 H82 Z M154 548 H218 V624 H154 Z"></path>
                                <text x="150" y="596">Shoes</text>
                            </g>
                        </svg>

                        <button class="whole-button" data-zone="whole" type="button">Whole</button>
                    </div>
                </div>

                <!-- ====================================================================================================
                     02B. FORK — TWO DISTINCT POSSIBLE SELVES; CLICK THE ONE TO SEND BACK
                     ==================================================================================================== -->
                <div class="fork" id="fork" hidden>
                    <button class="possible-self" id="choice-left" type="button" aria-label="Send the left possibility back">
                        <span class="studio-choice" id="studio-left" hidden>Studio choice</span>
                        <span class="possible-figure">
                            <img class="fork-person" id="person-left" src="assets/figure-man.png" alt="">
                            <span class="fork-layers" id="layers-left" aria-hidden="true"></span>
                        </span>
                        <span class="possible-price" id="price-left"></span>
                        <span class="send-back">Send back</span>
                    </button>

                    <div class="fork-divider" aria-hidden="true"><span>or</span></div>

                    <button class="possible-self" id="choice-right" type="button" aria-label="Send the right possibility back">
                        <span class="studio-choice" id="studio-right" hidden>Studio choice</span>
                        <span class="possible-figure">
                            <img class="fork-person" id="person-right" src="assets/figure-man.png" alt="">
                            <span class="fork-layers" id="layers-right" aria-hidden="true"></span>
                        </span>
                        <span class="possible-price" id="price-right"></span>
                        <span class="send-back">Send back</span>
                    </button>
                </div>

                <div class="completion" id="completion" hidden>
                    <p class="completion-total" id="completion-total"></p>
                    <div class="completion-buttons">
                        <button class="primary-button" id="take-look" type="button">Take this look</button>
                        <button class="quiet-button quiet-button--large" id="keep-exploring" type="button">Keep exploring</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ================================================================================================================
         03A. OPTIONAL STUDIO NOTES
         ================================================================================================================ -->
    <dialog id="notes-dialog">
        <form method="dialog" class="dialog-panel">
            <div class="dialog-header">
                <div>
                    <p class="eyebrow">A note for the studio</p>
                    <h2>What should influence the next possibilities?</h2>
                </div>
                <button class="close-button" value="cancel" aria-label="Close studio notes">×</button>
            </div>

            <div class="notes-grid">
                <label>
                    Colours
                    <select id="note-colour">
                        <option value="open">Surprise me</option>
                        <option value="petrol">Deep petrol</option>
                        <option value="plum">Plum and red</option>
                        <option value="violet">Muted violet</option>
                        <option value="quiet">Cream and quiet neutrals</option>
                    </select>
                </label>

                <label>
                    How far should we push?
                    <input id="note-adventure" type="range" min="0" max="100" value="55">
                    <span class="range-ends"><span>Recognise me</span><span>Challenge me</span></span>
                </label>

                <label>
                    Price
                    <select id="note-price">
                        <option value="style-first">Style first</option>
                        <option value="gentle">Keep an eye on the total</option>
                        <option value="boundary">Stay within a firm boundary</option>
                    </select>
                </label>

                <label>
                    Materials or requirements
                    <textarea id="note-material" rows="3" placeholder="For example: no leather, natural fibres, machine washable…"></textarea>
                </label>

                <label>
                    Environmental impact
                    <select id="note-environment">
                        <option value="not-deciding">Not a deciding factor</option>
                        <option value="prefer">Prefer lower-impact choices</option>
                        <option value="priority">Make it a priority</option>
                    </select>
                </label>
            </div>

            <button class="primary-button" id="save-notes" value="default">Let the studio respond</button>
        </form>
    </dialog>

    <!-- ================================================================================================================
         04A. FICTIONAL LOOK PANEL
         ================================================================================================================ -->
    <dialog id="look-dialog">
        <form method="dialog" class="dialog-panel">
            <div class="dialog-header">
                <div>
                    <p class="eyebrow">Your chosen self</p>
                    <h2>The complete look</h2>
                </div>
                <button class="close-button" value="cancel" aria-label="Close the look panel">×</button>
            </div>

            <div class="look-summary" id="look-summary"></div>
            <p class="prototype-note">Prototype only. No transaction will take place.</p>
        </form>
    </dialog>

    <script type="module" src="app.js"></script>
</body>
</html>
